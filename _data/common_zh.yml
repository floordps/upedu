about_title: 关于 UpEdu
about_description_1: UpEdu教育中心成立于2015年, 致力于为旧金山湾区家庭提供优质课后教育服务。我们的教育理念是"全面发展，个性化培养"。
about_description_2: 我们拥有经验丰富的教师团队, 所有教师均具备相关学科背景和教学资质, 平均教龄超过8年。
about_description_3: 我们的教室环境安全舒适，配备先进的教学设备和丰富的学习资源，为学生创造最佳的学习体验。
about_appointment_button: 预约参观

teacher_zhang: 张老师
teacher_zhang_profile: 毕业于南京师范大学文学院、南京中医药大学, 并进修学前教育、心理学及对外汉语研究生课程。拥有近25年中文教学经验, 学生年龄从学龄前到成人。曾任教于中国知名高校海外学院，所带学生多次在全国性比赛中获奖。现任旧金山一所公立及一所私立学校中文教师，教学方式生动，深受学生与家长好评。

teacher_li: 李老师
teacher_li_profile: 毕业于加州大学数学系, 获旧金山大学数学教育硕士学位。在旧金山任教5年, 拥有丰富的补习与考试备考经验，并多次带领学生参加学术交流活动。善于激发学生学习积极性，帮助他们转变对数学的兴趣，深受学生喜爱。

teacher_lin: 林老师
teacher_lin_profile: 毕业于师范学院，本科扎实，后获旧金山艺术大学室内设计硕士学位。兼具专业功底与创意实践经验，擅长激发学生的艺术潜能，深受学生喜爱。

teacher_zhao: 赵老师
teacher_zhao_profile: 毕业于云南大学，获理学硕士学位，并于西安交通大学取得工学硕士。曾为加州理工交流学者，具备深厚的学术背景与培训经验。擅长与学生互动，耐心细致，教学效果显著。

testimonials_title: 家长评价
testimonials_subtitle: 听听家长们对我们的评价
testimonials_1_text: UpEdu的课后托管服务解决了我们的大问题。孩子不仅安全有人看管, 作业也得到专业辅导，学习成绩明显提高。
testimonials_1_author: 李明，小学三年级家长
testimonials_2_text: SAT备考班的老师非常专业, 女儿的成绩提高了300多分, 最终被她梦想的大学录取了! 非常感谢UpEdu的老师们。
testimonials_2_author: 张华, 12年级学生家长
testimonials_3_text: "编程课老师很有耐心, 我的儿子从对编程一无所知到现在能自己制作小游戏, 进步非常大。兴趣班选UpEdu没错!"
testimonials_3_author: 王芳，五年级学生家长

