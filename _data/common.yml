about_title: About UpEdu
about_description_1: Founded in 2015, UpEdu Education Center is dedicated to providing high-quality after-school education services to families in the San Francisco Bay Area. Our educational philosophy is "holistic development and personalized training."
about_description_2: We have an experienced team of teachers. All teachers have relevant subject backgrounds and teaching qualifications, and their average teaching experience is over 8 years.
about_description_3: Our classrooms are safe and comfortable, equipped with advanced teaching equipment and rich learning resources to create the best learning experience for students.
about_appointment_button: Make an appointment to visit

teacher_zhang: Teacher Zhang
teacher_zhang_profile: Graduated from Nanjing University in Chinese Language and Literature & Traditional Chinese Medicine, studied early childhood education, and Psychology & Chinese as a foreign language. Over 25 years of experience teaching Chinese with student ranging in age from preschool to adults. He has taught at the overseas college of renowned Chinese universities and has brought his students to many national competitions. Currently, a Chinese teacher at a public and private school in San Francisco teaching in a lively manner that is well received by students and parents.

teacher_li: Teacher Li
teacher_li_profile: Graduated from the University of California with a degree in Mathematics and holds a Master's degreen in Mathematics Education from the University of San Francisco. Five years of teaching experience in San Francisco, extensive experience in tutoring & exam preparation and led students in academic exchange activities. Skilled stimulating studnets' enthusiasm for learning and helping htem shift their interest towards mathematics. Greatly beloved by the students.

teacher_lin: Teacher Lin
teacher_lin_profile: Graduated from a teacher training college with solid undergudate studies. Earned a Master's degree in Interior Design from San Francisco Art University. Possesses both professional expertise and creative practical experience, excels in unleashing students' artistic potential, and is highly appreciated by students.

teacher_zhao: Teacher Zhao
teacher_zhao_profile: Graduated from Yunan University with a Master's degree in Science and Master's degree in Engineering from Xi'an Jiaotong University. Previously served as an exhcnage scholar at California Institude of Technology, with a strong academic background and extensive training experience. Skilled in interacting with students, possesses patience and attention to details, and has achieved notable teaching results.

testimonials_title: Testimonials
testimonials_subtitle: Listen to what parents say about us
testimonials_1_text: UpEdu's after-school care service solved a major problem for us. Not only is my child safe and supervised, but he also receives professional help with his homework, and his academic performance has improved significantly.
testimonials_1_author: Li Ming, parent of a third grader
testimonials_2_text: The SAT prep teachers were very professional. My daughter's score improved by over 300 points, and she was eventually accepted into her dream university! I'm very grateful to the teachers at UpEdu.
testimonials_2_author: Zhang Hua, parent of a 12th grade student  
testimonials_3_text: The programming teacher is very patient. My son has made great progress, going from knowing nothing about programming to being able to make his own games. I think UpEdu was the right choice for my interest class!
testimonials_3_author: Wang Fang, parent of a fifth-grade student

