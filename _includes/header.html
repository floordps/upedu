<header>
    <div class="container header-container">
        <a href="{{ '/' | relative_url }}" class="logo-link">
            <div class="logo-container">
                    <img src="{{ '/assets/images/upedu-logo.jpg' | relative_url }}" alt="UpEdu Logo" class="logo">
                    <div>
                        <div class="brand-slogan">Grow Up, Edu Leads</div>
                    </div>
            </div>
        </a>
        <button class="mobile-menu-btn">☰</button>
        
        <nav>
            <ul id="menu">
                <li><a href="#about">About Us</a></li>
                <li><a href="#programs">Course Services</a></li>
                <li><a href="#our-teachers">Meet Our Teachers</a></li>
                <li><a href="#testimonials">Testimonials</a></li>
                <li><a href="#contact">Contact Us</a></li>
                <li><select class="language-switcher">
                    <option value="en" selected>English</option>
                    <option value="zh">Chinese</option>
                </select></li>
            </ul>
        </nav>
    </div>
    <script>

        $(function() {
            $('.mobile-menu-btn').on('click', function() {
                $('#menu').toggleClass('show');
            });
            $('.language-switcher').on('change', function() {
                var defaultHostName = window.location.hostname;
                if (defaultHostName.startsWith('cn.')) {
                    defaultHostName = defaultHostName.replace('cn.', '');
                }
                if ($(this).val() === 'zh') {
                    window.location.href = 'https://cn.' + defaultHostName;
                } else {
                    window.location.href = 'https://' + defaultHostName;
                }
            });
        });
    </script>
</header>
